services:
  redis:
    image: redis:7-alpine
    restart: always
    ports:
      - "6379:6379"
    networks:
      - ftdi-network
  # ftdi_service_hardware:
  #   image: reg.fls-engineering.de/library/ftdi:2.0.0

  #   networks:
  #     - ftdi-network
  #   working_dir: /app
  #   volumes:
  #     - signals:/signals
  #     - /dev/ttyUSB0:/dev/ttyUSB0
  #     - ./ftdi_service.py:/app/ftdi_service.py
  #   # command: tail -f /dev/null  # Placeholder command to keep container running; replace with actual command as needed
  #   # command: python3 -m watchfiles "python3 ftdi_service.py"
  #   environment:
  #     - REDIS_HOST=redis
  #     - REDIS_PORT=6379
  #     - CONTROL_CHANNEL=camera_control
  #     - STATUS_CHANNEL=camera_status
  #     - SIMULATION_MODE=False
  #     - SERIAL_PORT=/dev/ttyUSB0
  #   privileged: true
  #   restart: unless-stopped
  #   depends_on:
  #     - redis
  camera:
    image: reg.fls-engineering.de/library/cam_v4l2:3.0.0
    working_dir: /test
    volumes:
      - signals:/signals
      - /opt/platform-builder/license:/license
      - ./settings/:/settings/
      - ./pisp_config.yaml:/app/pisp_config.yaml
      - /mnt/data:/history_images
    environment:
      - CAMERA_IPCPORT=ipc:///signals/cam.out.0
      - CAMERA_IPCPORTCONTROL=ipc:///signals/cam.control.0
      - CAMERA_DEVICE=/dev/video0
      - CAMERA_SENDJPG=ON
      - CAMERA_PERFORMANCE_TESTING=OFF
      - CAMERA_FORCE_ROI=OFF
      - CAMERA_IDENTIFIER_FILE_PATH=/license/identifier.enc
      - CAMERA_LICENSE_FILE_PATH=/license/license.lic
      - CAMERA_ALIGNMENT=32
      - CAMERA_HAS_SUBDEV=ON
      - CAMERA_SUBDEV_PATH=/dev/v4l-subdev2
      - CAMERA_USE_ISP=OFF
      - CAMERA_CONTROL_SETTINGSFILE=/settings/cameraSettings.json
      - LIBCAMERA_RPI_CONFIG_FILE=/app/pisp_config.yaml
      - CAMERA_TEST_MODE=OFF
      - CAMERA_MAX_WIDTH_JPG=1000
      - CAMERA_SENDJPG=ON
      - CAMERA_SETCONTROLS_AT_RESUME=ON
      - CAMERA_MAX_FRAMERATE=100000
      - CAMERA_SAVE_FOLDER=/history_images
      - CAMERA_SAVE_RAW=ON
      - CAMERA_SAVE_QUEUE_MAX_ENTRIES=20
      - CAMERA_PERFORMANCE_MINUS=OFF
    network_mode: host
    privileged: true
    restart: unless-stopped
    cpuset: "2,3"
    cpu_shares: 2048
    depends_on:
      backend:
        condition: service_healthy
        restart: true

  backend:
    image: reg.fls-engineering.de/library/backend:2.6.0
    volumes:
      - signals:/signals
      - images:/images
      - /proc/sysrq-trigger:/sysrq
      - /boot/:/boot/
      - ./ftp/:/ftp/
      - ./settings/backendSettings.json:/app/appBackend/backendSettings.json
      - ../sources/v4l2-source/appBackend/appBackend.py:/app/appBackend/appBackend.py
      - ./settings/settings.json:/app/appBackend/settings.json
      - ./settings/filterControls.json:/app/filterControls.json
      - ./settings/runtimeSettings.json:/app/appBackend/runtimeSettings.json
      - ./settings/navServices.json:/app/navServices.json
      - /run/systemd/system:/run/systemd/system
      - /bin/systemctl:/bin/systemctl
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /opt/platform-builder/license:/license
      - ./settings:/settings
      - ./history_images:/history_images
      - ./trigger_images:/trigger_images
      - ./settings/users.json:/app/appBackend/users.json
      - ./dump:/dump
      - ./var:/version_info
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
      - ./static_files:/static_share
    cap_add:
      - SYS_BOOT
      - SYS_ADMIN
    environment:
      - base_folder_settings=/settings
      - boot_config_file=/boot/firmware/config.txt
      - boot_vc_config_file=/boot/firmware/config_vc-mipi-driver-bcm2712.txt
      - status_file=/ftp/status.json
      - camera_control_host=ipc:///signals/cam.control.
      - camera_send_host=ipc:///signals/cam.out.
      - ftp_settings_file=/ftp/ftpsettings.json
      - webapp1_host=ipc:///signals/blobApp
      - filterControl_file_path=/app/filterControls.json
      - nav_services_file_path=/app/navServices.json
      - identifier_file_path=/license/identifier.enc
      - license_file_path=/license/license.lic
      - ./history_images_directory=/history_images/
      - app_active=True 
      - _app_host=tcp://192.168.1.60:410
      - app_host=ipc:///signals/app.
      - csv_file=/history_images/app.csv
      - ftp_folder=/./trigger_images
      - customer_logo=/settings/customer_logo.png
      - camera_env_file=/settings/camera.env
      - parameters_login_needed=True
      - version_file=/version_info/build_info.json
      - FTDI_INTEGRATION=false
      - ZMQ_USE_MSGPACK=false
      - SERVE_STATIC=false
    privileged: true
    working_dir: /app/appBackend
    command: uvicorn appBackend:appASGI --host '*' --port 8000 --log-level info
    restart: unless-stopped
    network_mode: host
    cpuset: "0,1"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/frontend/current_time"]
      interval: 5s
      timeout: 2s
      retries: 5
      start_period: 2s



  ftpServer:
    image: reg.fls-engineering.de/library/ftpserver:1.4.0
    network_mode: host
    command: python ftpServer.py --user raspberrypi --password pirmasens --passive 4000-4010
    volumes:
      - ./history_images:/ftp_root/raspberrypi/liveviewImages
      - ./trigger_images:/ftp_root/raspberrypi/triggerImages
    restart: always
  
  ttyd:
    build: ./ttyd
    ports:
     - 3000:7681
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: ttyd --writable -t fontSize=20 --base-path /ttyd ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null raspberrypi@host.docker.internal
    restart: unless-stopped

  siemensstern:
    image: reg.fls-engineering.de/library/siemensstern:1.1.0
    env_file:
      - .env
    environment:
      - SIEMENS_SOCKET=ipc:///signals/app.0
      - SIEMENS_TEMPLATE_PATH=/app/template.png
      - SIEMENS_POSITION_DETECTION_INTERVAL=10
      - SIEMENS_SHARPNESS_INTERVAL=5
      - SIEMENS_VISUALIZATION_INTERVAL=5
      - SIEMENS_DEBUG=OFF
      - SIEMENS_SETTINGS_FILENAME=/settings/siemenssternSettings.json
    volumes:
      - signals:/signals
      - ./template.png:/app/template.png
      - ./settings/siemenssternSettings.json:/settings/siemenssternSettings.json
    restart: unless-stopped
  vc-trigger:
    image: ghcr.io/notavis-gmbh/notavis-mipi-trigger-public:0.2
    ports:
      - "8501:8501"
    environment:
      VC_TRIGGER_LOG_LEVEL: INFO
      # Mock mode: UI works fully, GPIO 18 is never touched. Flip to "0" and
      # uncomment devices/group_add below once the trigger wiring is
      # confirmed and you want the container to actually drive GPIO 18.
      VC_TRIGGER_MOCK: "1"
    # devices:
    #   - /dev/gpiochip0:/dev/gpiochip0
    # group_add:
    #   - "986"   # gpio group GID on this board (getent group gpio)
    command:
      - "--server.address=0.0.0.0"
      - "--server.port=8501"
      - "--server.headless=true"
      - "--browser.gatherUsageStats=false"
      - "--server.baseUrlPath=/trigger"
      - "--server.enableCORS=false"
      - "--server.enableXsrfProtection=false"
    restart: unless-stopped
    healthcheck:
      # Overrides the image's default (which checks /_stcore/health at the
      # root and would always fail once --server.baseUrlPath moves it).
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8501/trigger/_stcore/health', timeout=3).status == 200 else 1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  nginx:
    image: nginx:alpine
    network_mode: host
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/usr/share/nginx/html:ro
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      ttyd:
        condition: service_started
      vc-trigger:
        condition: service_healthy
  # frpc:
  #   image: ghcr.io/fatedier/frpc:v0.71.0
  #   container_name: frpc
  #   restart: unless-stopped
  #   command: ["-c", "/etc/frp/frpc.toml"]
  #   network_mode: host   # simplest way to reach localhost:22 on the client
  #   volumes:
  #     - ./frpc/frpc.toml:/etc/frp/frpc.toml:ro


volumes:
  signals:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
      o: size=10M
  images:
  logs:
  static_files:
networks:
  ftdi-network:
    driver: bridge
