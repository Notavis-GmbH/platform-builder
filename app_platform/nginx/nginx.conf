map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Main backend app (API + frontend UI). This used to be exposed directly
    # on host port 80; nginx now sits in front of it so every service below
    # shares one origin and can be embedded in iframes without cross-origin
    # blocking.
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ttyd web terminal, embeddable at /ttyd/. Requires ttyd's
    # --base-path /ttyd flag (set in docker-compose.yml) so its assets and
    # websocket connect back through this same prefix.
    location /ttyd/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # notavis-mipi-trigger Streamlit UI (GPIO/PWM camera trigger),
    # embeddable at /trigger/. Started with --server.baseUrlPath=/trigger
    # (see docker-compose.yml) so generated links/assets/websocket stay
    # under this prefix.
    location /trigger/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Template for the next embedded service (e.g. another Streamlit app).
    # 1. Publish its port to the host in docker-compose.yml (e.g. "8502:8502").
    # 2. Run it with a matching base path so generated links/assets/websocket
    #    stay under the prefix, e.g. for Streamlit:
    #      streamlit run app.py \
    #        --server.baseUrlPath=/myapp \
    #        --server.enableCORS=false \
    #        --server.enableXsrfProtection=false
    # 3. Uncomment and adjust the block below.
    #
    # location /myapp/ {
    #     proxy_pass http://127.0.0.1:8502;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
}
