map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    # Compiled Angular frontend, copied into this shared volume by the
    # backend container on startup (see docker-compose.yml). Serving it
    # straight from nginx means the browser gets the app shell without an
    # extra hop through appBackend/uvicorn. Requires SERVE_STATIC=false on
    # the backend so appBackend.py doesn't also mount it on "/".
    root /usr/share/nginx/html;
    index index.html;

    # The app shell must never be served from a stale browser cache. nginx
    # sends only Last-Modified/ETag for index.html, which lets Chromium apply
    # heuristic freshness and replay an outdated shell for hours without
    # revalidating - after a frontend update or a mount change the kiosk then
    # keeps showing the previous page until someone hits reload. The hashed
    # assets next to it stay cacheable, their names change on every build.
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    # REST API, proxied straight through to appBackend.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Socket.IO websocket, mounted by appBackend at this path.
    location /ws/socket.io/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        # Fehlten hier (im Gegensatz zu /ttyd/ und /trigger/ unten) - ohne
        # diese zwei Header kann nginx den WebSocket-Upgrade-Handshake nicht
        # durchreichen. Socket.IO faellt dann dauerhaft auf Long-Polling
        # zurueck, was den ~50-110ms Emit-Overhead in appBackend erklaert.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Everything else: served straight from disk, falling back to
    # index.html for unknown paths so Angular's client-side router still
    # works on deep links/refreshes (mirrors appBackend's old
    # SPAStaticFiles fallback).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ttyd web terminal, embeddable at /ttyd/. Requires ttyd's
    # --base-path /ttyd flag (set in docker-compose.yml) so its assets and
    # websocket connect back through this same prefix.
    location /ttyd/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # notavis-mipi-trigger Streamlit UI (GPIO/PWM camera trigger),
    # embeddable at /trigger/. Started with --server.baseUrlPath=/trigger
    # (see docker-compose.yml) so generated links/assets/websocket stay
    # under this prefix.
    location /trigger/ {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Template for the next embedded service (e.g. another Streamlit app).
    # 1. Publish its port to the host in docker-compose.yml (e.g. "8502:8502").
    # 2. Run it with a matching base path so generated links/assets/websocket
    #    stay under the prefix, e.g. for Streamlit:
    #      streamlit run app.py \
    #        --server.baseUrlPath=/myapp \
    #        --server.enableCORS=false \
    #        --server.enableXsrfProtection=false
    # 3. Uncomment and adjust the block below.
    #
    # location /myapp/ {
    #     proxy_pass http://127.0.0.1:8502;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
}
