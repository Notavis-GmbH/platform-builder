# Reduce writeback burst size to eliminate BMP capture drops
# Root cause found 2026-08-12 on UniversitySidney2 with drop-hunt sampler
# Effect: dirty pages flushed at 32/64 MB instead of default 410/819 MB,
# eliminating 1.8-2.7 s I/O stalls during continuous BMP capture at 60 fps.
vm.dirty_background_bytes = 33554432
vm.dirty_bytes = 67108864
vm.dirty_writeback_centisecs = 100
vm.dirty_expire_centisecs = 1000